<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-neutral-100 min-h-screen flex items-center justify-center p-6">
    <div class="grid grid-cols-2 min-h-[640px] max-w-7xl bg-white shadow-2xl shadow-indigo-200 overflow-hidden rounded-2xl">

        <!-- Panel Izquierdo -->
        <div class="flex flex-col justify-between p-8 text-white font-bold bg-gradient-to-br from-indigo-500 via-red-400 to-purple-600">

            <p>Bienvenido</p>
            <h2>Sistema de Gestión</h2>


        </div>
        <div class="p-4 flex flex-col m-3 items-center justify-center">
            <h1 class="text-indigo font-bold text-2xl">Login</h1>
            <form class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 ">Your email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        
                        class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500 transition"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            placeholder="••••••••••"
                            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 pr-10 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500 transition"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 transition"
                >
                    Iniciar sesión
                </button>
            </form>
        </div>

    </div>
</body>
</html>
