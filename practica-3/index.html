<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-neutral-100 min-h-screen flex items-center justify-center p-6">

    <div class="grid grid-cols md:grid-cols-2 h-auto md:min-h-[640px] max-w-7xl bg-white rounded-2xl shadow-2xl shadow-indigo-200 overflow-hidden">

        <!-- Panel izquierdo -->
        <div class="hidden md:flex flex-col justify-between p-8 m-3 rounded-[1.5rem] bg-gradient-to-br from-sky-300 via-indigo-700 to-violet-400">
            
            <p class="text-white font-semibold">Bienvenido</p>
            <div class="text-white">
                <h2 class="text-2xl font-bold leading-snug">
                    Accede a tu informacion y mantente organizado con nuestra plataforma.
                </h2>
            </div>
        </div>

        <!-- Panel derecho -->
        <div class="flex flex-col justify-center p-12">
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Login</h1>
            <p class="text-sm text-slate-500 mb-6">
                Accede a tu cuenta y mantente organizado con nuestra plataforma.
            </p>

            <form class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Your email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="you@example.com"
                        class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500 transition"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <div class="relative">
                        <input
                            id="password"
                            type="password"
                            placeholder="••••••••••"
                            class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 pr-10 text-sm text-slate-700 placeholder:text-slate-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:border-indigo-500 transition"
                        >
                    </div>
                </div>

                <button
                    type="submit"
                    class="bg-red-400 w-full rounded-lg md:bg-indigo-600 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2 transition"
                >
                    Iniciar sesión
                </button>
            </form>


        </div>

    </div>

</body>
</html>
